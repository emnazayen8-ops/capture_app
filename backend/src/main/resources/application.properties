# ============================================
# CONFIGURATION MySQL
# ============================================

spring.datasource.url=jdbc:mysql://localhost:3306/capture_app?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysqlemna123.

# Driver MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# CONFIGURATION JPA / Hibernate
# ============================================

# 'update' = met à jour les tables sans supprimer les données
spring.jpa.hibernate.ddl-auto=update

# Dialecte MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Afficher les requêtes SQL dans la console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Exécuter data.sql au démarrage
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ============================================
# CONFIGURATION SERVEUR
# ============================================

server.port=8080

# Taille max pour upload de fichiers (captures en BLOB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ============================================
# MICRO-SERVICE PYTHON DE GENERATION VIDEO
# ============================================
# URL du micro-service Flask/FastAPI (dossier /video-service) qui assemble
# les captures (image + description/narration) en une vidéo MP4.
video.service.url=http://localhost:5001


